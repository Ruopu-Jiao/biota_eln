[package]
name = "biota-desktop"
version = "0.1.0"
description = "Local-first scientific workspace"
authors = ["Biota contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "biota_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "biota-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
notify = "8"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
